name: 'dinosaurs'
version: '1.0.0'
config-version: 2

# Matches the profile name each teammate defines in ~/.dbt/profiles.yml (never committed)
profile: 'dinosaurs'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dinosaurs:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
